# Manual deploy of hybrid-data-svc onto the local Woodpecker runner host.
#
# Triggered ONLY by an explicit "New Pipeline" run in the Woodpecker UI
# (or via the CLI / API) — pushes to main do NOT auto-deploy. This is by
# design: deploys are a deliberate operator action.
#
# Required parameter (manual-build variable):
#   DEPLOY_MAIN = true
#     Flag that authorizes deploying `main` to this host. The guard step
#     refuses to proceed without it. Naming reflects intent: this pipeline
#     deploys the `main` branch — setting the flag is the operator's
#     explicit go-ahead. Anything other than the literal string `true` is
#     treated as "don't deploy".
#
# Optional parameters:
#   DEPLOY_PATH        Override the host clone location.
#                      Default: $HOME/projects/hybrid-data-svc
#                      (resolved from the runner user's real home, not the
#                      ephemeral per-step $HOME).
#   REST_HOST_PORT     Override the host port published by bar-rest in this
#                      environment (default 8001 from .env / docker-compose).
#                      The post-deploy healthcheck polls this port.
#
# Pipeline:
#   1. guard       - assert DEPLOY_MAIN=true
#   2. deploy      - git fetch + reset --hard origin/main; docker compose
#                    up -d --build  (rebuilds all three project services)
#   3. healthz     - poll http://localhost:$REST_HOST_PORT/healthz for up
#                    to 60s; fails the build if /healthz never returns 200.
#
# Runs on the same macOS local backend as .woodpecker/pr.yml — no $HOME
# leak, no docker socket leak, no hardcoded usernames.

when:
  - event: manual

# Skip Woodpecker's auto-clone entirely. This pipeline never touches
# $CI_WORKSPACE; the deploy step `cd`s into the host's pre-existing
# checkout at $DEPLOY_PATH. Without this, Woodpecker's default clone
# runs `git lfs fetch` at the end and fails on hosts without git-lfs
# installed — even though this repo doesn't use LFS.
skip_clone: true

steps:
  - name: guard
    image: bash
    commands:
      # Manual build params land as env vars. DEPLOY_MAIN must equal "true"
      # explicitly — anything else (including the unset case) refuses.
      # Brace-less form (`$DEPLOY_MAIN`) so Woodpecker's templater doesn't
      # try to expand it at YAML-render time.
      - 'if [ "$DEPLOY_MAIN" != "true" ]; then echo "Refusing to deploy main: set DEPLOY_MAIN=true in the manual build params (see README §Deployment)."; exit 1; fi'

  - name: deploy
    image: bash
    # Whole body in a single shell block — each `commands:` item runs in
    # its own shell on the local backend, so multi-item recipes lose
    # variable state between items.
    #
    # IMPORTANT: avoid the brace form of shell variable expansion in shell
    # bodies (i.e. dollar-brace-VAR-brace). Woodpecker performs its own
    # template-interpolation pass on dollar-brace patterns BEFORE the
    # script reaches bash, and its parser scans the entire YAML file —
    # comments included — for dollar-brace tokens, choking on nested
    # forms with "unable to parse variable name". We use the brace-less
    # $VAR form (which Woodpecker leaves alone) and apply defaults via
    # explicit `if [ -z "$VAR" ]; then ...; fi` blocks.
    commands:
      - |-
        OPERATOR_HOME="/Users/$(id -un)"
        if [ -z "$DEPLOY_PATH" ]; then
          DEPLOY_PATH="$OPERATOR_HOME/projects/hybrid-data-svc"
        fi
        export DOCKER_HOST="unix://$OPERATOR_HOME/.colima/default/docker.sock"
        echo "[deploy] OPERATOR_HOME=$OPERATOR_HOME"
        echo "[deploy] target dir: $DEPLOY_PATH"
        echo "[deploy] DOCKER_HOST=$DOCKER_HOST"
        # Pre-flight: $DEPLOY_PATH must exist AND be a git working tree.
        # Surfacing this here keeps the operator from chasing an opaque
        # `fatal: not a git repository` later.
        if [ ! -d "$DEPLOY_PATH" ]; then
          echo "[deploy] $DEPLOY_PATH does not exist — check DEPLOY_PATH"
          exit 1
        fi
        cd "$DEPLOY_PATH"
        if [ ! -d .git ]; then
          echo "[deploy] $DEPLOY_PATH is not a git repository — check DEPLOY_PATH"
          exit 1
        fi
        # Fail loudly if the working tree has uncommitted edits to tracked
        # files. Untracked files like .env / .venv are excluded — they're
        # gitignored and survive `git reset --hard` anyway.
        if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
          echo "[deploy] working tree is dirty — refusing to git reset:"
          git status --short
          exit 1
        fi
        git fetch origin main --quiet
        git reset --hard origin/main
        echo "[deploy] HEAD now at $(git rev-parse --short HEAD)"
        # Rebuild only the project services. Postgres has no Dockerfile,
        # so `up -d --build` leaves it alone.
        docker compose up -d --build bar-grpc bar-rest data-svc

  - name: healthz
    image: bash
    # Same `$VAR`-only convention as the deploy step.
    commands:
      - |-
        OPERATOR_HOME="/Users/$(id -un)"
        export DOCKER_HOST="unix://$OPERATOR_HOME/.colima/default/docker.sock"
        host_port="$REST_HOST_PORT"
        if [ -z "$host_port" ]; then
          host_port="8001"
        fi
        url="http://localhost:$host_port/healthz"
        echo "[deploy] polling $url for readiness…"
        for i in $(seq 1 12); do
          code=$(curl -sf -o /dev/null -w "%{http_code}" "$url" || echo 000)
          echo "[deploy]   attempt $i: HTTP $code"
          if [ "$code" = "200" ]; then
            echo "[deploy] ✓ healthz green"
            exit 0
          fi
          sleep 5
        done
        echo "[deploy] ✗ healthz never returned 200 after 60s"
        exit 1
