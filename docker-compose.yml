services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datasvc}
      POSTGRES_USER: ${POSTGRES_USER:-datasvc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datasvc} -d ${POSTGRES_DB:-datasvc}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Writer: polls TradingView, validates, upserts into Postgres.
  data-svc:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-m", "data_svc.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    command: ["python", "-m", "data_svc"]

  # Reader: gRPC server exposing bars to clients (bots, audits).
  bar-grpc:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
    command: ["python", "-m", "data_svc.grpc_server"]
