services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datasvc}
      POSTGRES_USER: ${POSTGRES_USER:-datasvc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      # Named volume — lives on the Docker VM's ext4, not the macOS
      # bind-mount file-sharing layer (which corrupted the WAL on 2026-05-20).
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datasvc} -d ${POSTGRES_DB:-datasvc}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Writer: polls TradingView, validates, upserts into Postgres.
  data-svc:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-m", "data_svc.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    command: ["python", "-m", "data_svc"]
    restart: unless-stopped

  # Reader: gRPC server exposing bars to clients (bots, audits).
  bar-grpc:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
    command: ["python", "-m", "data_svc.grpc_server"]
    restart: unless-stopped

  # Reader: REST gateway. Same image, different command. Pure thin gateway
  # over BarService + AssetService gRPC — no Postgres connection of its own
  # (spec §Motivation).
  bar-rest:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      REST_LISTEN_HOST: 0.0.0.0
      REST_LISTEN_PORT: "8001"
      GRPC_TARGET: bar-grpc:50051
    depends_on:
      bar-grpc:
        condition: service_started
    ports:
      # Defaults to the spec literal "8001:8001". Hosts on the shared Mac
      # stack (where TNR holds 8001 and CNV holds 8002) override via
      # `REST_HOST_PORT=8003` in .env — value substituted at compose time.
      - "${REST_HOST_PORT:-8001}:8001"
    command: ["python", "-m", "data_svc.rest_server"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz').status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
