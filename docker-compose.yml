services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datasvc}
      POSTGRES_USER: ${POSTGRES_USER:-datasvc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      # Named volume — lives on the Docker VM's ext4, not the macOS
      # bind-mount file-sharing layer (which corrupted the WAL on 2026-05-20).
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datasvc} -d ${POSTGRES_DB:-datasvc}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Writer: polls TradingView, validates, upserts into Postgres.
  data-svc:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-m", "data_svc.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    command: ["python", "-m", "data_svc"]
    restart: unless-stopped

  # Reader: gRPC server exposing bars to clients (bots, audits).
  bar-grpc:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
    command: ["python", "-m", "data_svc.grpc_server"]
    restart: unless-stopped

  # Reader: REST gateway. Same image, different command.
  # /v1/quote and /healthz are thin gateways over BarService gRPC
  # (spec §Motivation). Phase 2 endpoints (/v1/historical, /v1/search,
  # /v1/profile) read Postgres directly — see PR description for why
  # they cannot route through the existing BarService.
  bar-rest:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      REST_LISTEN_HOST: 0.0.0.0
      REST_LISTEN_PORT: "8001"
      GRPC_TARGET: bar-grpc:50051
      DATABASE_URL: postgresql://${POSTGRES_USER:-datasvc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datasvc}
    depends_on:
      bar-grpc:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      # Host:container — 8001 inside the container (matches spec); host
      # publication is 8003 because 8001 and 8002 are already owned on
      # the shared Mac stack (tnr-backend@8001, cnv-backend@8002). The
      # internal port stays 8001 so consumers on the docker network use
      # `http://hybrid-data-svc-bar-rest:8001/...` exactly as the spec
      # documents — only host-side curl/dev access uses 8003.
      - "8003:8001"
    command: ["python", "-m", "data_svc.rest_server"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz').status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
