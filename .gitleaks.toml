# gitleaks config for hybrid-data-svc.
# Extends the default ruleset and adds patterns for the providers we use.
# This is a Python data service (Postgres + gRPC/REST gateway); the only
# secret-bearing material in the tree is Postgres connection strings, so the
# tailored rule set is just the generic Postgres connection-string pattern.

title = "hybrid-data-svc gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "postgres-connection-string"
description = "Postgres connection string with a real password"
regex = '''postgres(ql)?://[^:]+:[^@]+@[^/]+'''
keywords = ["postgres://", "postgresql://"]
# IMPORTANT: every allowlist below is SCOPED TO THIS RULE — they only
# silence the postgres-connection-string detection, NOT the default
# ruleset. An AWS key, Stripe token, or other generic secret committed
# under data_svc/*.py, docs/*, tests/* etc. still trips the default rules.
[rules.allowlist]
description = "Throwaway test/example/default postgres connection strings (per-rule)"
# Go's RE2 engine has no negative lookahead, so exclude the throwaway
# `postgres:postgres@localhost` / `@127.0.0.1` ephemeral local/CI test
# DBs via a regex allowlist. A genuine leak targets a real host with a
# real password and still trips.
regexes = [
  '''postgres(ql)?://postgres:postgres@(localhost|127\.0\.0\.1)''',
]
# Path allowlist for files that legitimately hold the
# `datasvc:datasvc@postgres` / env-interpolated throwaway connection
# string as a placeholder, source default, or docs example. Scoped here
# (not in a top-level [allowlist]) so the default ruleset stays active
# on these paths and catches non-postgres secrets.
paths = [
  '''\.env\.example$''',
  '''.*_test\.go$''',
  '''.*\.test\.(ts|js)$''',
  '''.*_test\.(ts|js)$''',
  '''.*_test\.py$''',
  '''tests/.*''',
  '''data_svc/.*\.py$''',
  '''scripts/.*\.py$''',
  '''docker-compose\.ya?ml$''',
  '''docs/.*''',
  '''\.gitleaks\.toml$''',
]
