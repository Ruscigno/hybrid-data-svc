syntax = "proto3";

package datasvc.v1;

// BarService — OHLCV bars served from Postgres. No TradingView calls.
service BarService {
  // Most recent `count` closed bars for (symbol, timeframe), sorted ASC by ts.
  rpc GetRecentBars(GetRecentBarsRequest) returns (BarsResponse);

  // Closed bars in the inclusive range [from_ts, to_ts] for (symbol, timeframe).
  // Capped at `limit` bars (server-enforced max 5000); when more would fit,
  // returns the most recent `limit` and sets truncated=true.
  rpc GetBarsInRange(GetBarsInRangeRequest) returns (BarsResponse);

  // Readiness check used by bot clients before starting trading loops.
  // Returns ready=true when bar_count >= min_bars for (symbol, timeframe).
  rpc HealthCheck(HealthRequest) returns (HealthResponse);

  // Liveness ping. Verifies the gRPC server can round-trip AND that its
  // Postgres pool is reachable (executes a SELECT 1). Used by the REST
  // gateway's /healthz route to populate db_reachable without holding its
  // own Postgres connection.
  rpc Ping(PingRequest) returns (PingResponse);
}

// AssetService — curated asset catalog (TradingView identifier ↔ ccxt
// storage_symbol bridge + metadata for /v1/search and /v1/profile, plus
// catalog management via /v1/assets).
service AssetService {
  // Lookup by TradingView identifier. Returns NOT_FOUND when the symbol
  // isn't in the catalog.
  rpc GetProfile(GetAssetProfileRequest) returns (Asset);

  // Substring search (case-insensitive) over (symbol, name).
  rpc Search(SearchAssetsRequest) returns (SearchAssetsResponse);

  // Paginated catalog list, augmented with per-asset runtime status
  // aggregated from feeds + cache_meta. Backs GET /v1/assets.
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);

  // Register a new asset + start polling it (one feed row per requested
  // timeframe with status='pending'). Returns the new row with created=true,
  // OR the existing row with created=false when the symbol already exists.
  // Backs POST /v1/assets.
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
}

message Bar {
  // Bar open time, unix epoch seconds, UTC.
  int64 ts = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double volume = 6;
}

message GetRecentBarsRequest {
  string symbol = 1; // ccxt-style key, e.g. "BTC/USDT:USDT"
  string timeframe = 2; // "15", "30", "1h", "4h", "1D", "1W"
  int32 count = 3; // bars to return (server may cap)
}

message GetBarsInRangeRequest {
  string symbol = 1; // ccxt-style key
  string timeframe = 2;
  int64 from_ts = 3; // inclusive epoch seconds
  int64 to_ts = 4; // inclusive epoch seconds
  int32 limit = 5; // 0 or unset -> server default; max 5000
}

message BarsResponse {
  repeated Bar bars = 1;
  // True when the underlying range had more bars than `limit` permitted; the
  // returned set is the MOST RECENT `limit` bars. False/unset otherwise.
  bool truncated = 2;
}

message HealthRequest {
  string symbol = 1;
  string timeframe = 2;
  int32 min_bars = 3;
}

message HealthResponse {
  bool ready = 1;
  int32 bars_available = 2;
  int64 last_bar_ts = 3;
}

message PingRequest {}

message PingResponse {
  // True if the gRPC server's Postgres pool returned a row for SELECT 1.
  bool db_reachable = 1;
}

message Asset {
  string symbol = 1; // TradingView identifier, uppercase (REST surface)
  string storage_symbol = 2; // ccxt key matching bars.symbol
  string name = 3;
  string exchange = 4;
  string currency = 5; // ISO 4217
  string asset_class = 6; // EQUITY | CRYPTO | ETF | FUND
  string asset_subclass = 7; // empty when unknown
  string isin = 8; // empty when unknown
  string country = 9; // empty when unknown
}

message GetAssetProfileRequest {
  string symbol = 1; // TradingView identifier
}

message SearchAssetsRequest {
  string query = 1; // substring (case-insensitive)
  int32 limit = 2; // max results (server caps at 50)
}

message SearchAssetsResponse {
  repeated Asset results = 1;
}

// Asset wrapped with its runtime status (aggregated from feeds) and the
// catalog-management metadata (added_at, last_bar_ts). Returned by
// ListAssets and CreateAsset; the plain Asset message stays as the
// metadata-only shape used by GetProfile/Search.
message AssetWithStatus {
  Asset asset = 1;
  string status = 2; // 'active' | 'pending' | 'inactive'
  int64 added_at = 3; // unix seconds; first INSERT, preserved on UPDATE
  int64 last_bar_ts = 4; // 0 when no bars stored yet
}

message ListAssetsRequest {
  string exchange = 1; // empty = no filter
  string asset_class = 2; // empty = no filter
  string query = 3; // substring (case-insensitive); empty = no filter
  string cursor = 4; // last symbol from previous page; empty = first page
  int32 limit = 5; // 0 = server default (100); server caps at 500
}

message ListAssetsResponse {
  repeated AssetWithStatus assets = 1;
  string next_cursor = 2; // empty when no more pages
}

message CreateAssetRequest {
  Asset asset = 1;
  repeated string timeframes = 2; // empty = server default ["1h"]
  string tv_symbol = 3; // empty = defaults to asset.symbol
}

message CreateAssetResponse {
  AssetWithStatus asset_with_status = 1;
  // True for fresh INSERT; false when the symbol already existed
  // (asset_with_status carries the prior row in that case).
  bool created = 2;
  // Hint to the operator: roughly how long until the writer picks the new
  // feeds up. Matches the data-svc cycle interval (~30s).
  int32 poll_eta_seconds = 3;
}
