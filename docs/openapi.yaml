# OpenAPI source of truth for the hybrid-data-svc REST gateway.
#
# This document is hand-authored and lives at HEAD; it drives Pydantic model
# codegen (`make codegen`) and is asserted byte-equal to FastAPI's runtime
# `app.openapi()` output by tests/rest/test_openapi_drift.py.
#
# Deviations from docs/hybrid-data-svc-rest-api-spec.md (documented in the
# implementation report):
#   * Validation-error schemas (HTTPValidationError, ValidationError) are
#     listed here explicitly so the drift test stays a plain dict equality;
#     they mirror what FastAPI auto-emits.
#   * CORS: Access-Control-Allow-Origin is "*" with allow_credentials=false;
#     browsers must not send credentialed requests. Documented here, set in
#     data_svc/rest/app.py.

openapi: 3.1.0
info:
  title: hybrid-data-svc REST API
  version: 0.1.0
  description: |
    REST gateway over the internal `BarService` gRPC + the curated `assets`
    catalog. Designed to feed Ghostfolio's MANUAL data source and any other
    HTTP-only consumer.

    All `/v1/*` endpoints accept an optional `Authorization: Bearer <token>`
    header; auth is enforced only when the `REST_AUTH_TOKEN` env var is set.
    `/healthz` is always open.

    Symbols use TradingView chart identifiers, uppercase, `:`-separated
    (e.g. `BINANCE:BTCUSDT`, `NASDAQ:AAPL`). URL-encode `:` as `%3A` in
    path parameters.

servers:
  - url: http://localhost:8001
    description: Local docker-compose default.

tags:
  - name: quote
    description: Latest closed-bar price.
  - name: historical
    description: OHLCV bars over a date range.
  - name: search
    description: Asset autocomplete.
  - name: profile
    description: Asset metadata lookup.
  - name: catalog
    description: Catalog management — list and onboard polled symbols at runtime.
  - name: health
    description: Liveness probe.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe.
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: Gateway is reachable; DB connectivity and asset catalog state are reported in the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/quote/{symbol}:
    get:
      tags: [quote]
      summary: Latest closed-bar price for a symbol.
      operationId: getQuote
      parameters:
        - $ref: "#/components/parameters/SymbolPath"
        - name: timeframe
          in: query
          required: false
          description: Bar timeframe to return the latest close for.
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: max_age_seconds
          in: query
          required: false
          description: "Bars older than this are returned with `stale: true`. Does not change the HTTP status."
          schema:
            type: integer
            minimum: 1
            default: 3600
      responses:
        "200":
          description: Latest closed bar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSymbol"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/NoData"

  /v1/historical/{symbol}:
    get:
      tags: [historical]
      summary: OHLCV bars over a date range.
      operationId: getHistorical
      parameters:
        - $ref: "#/components/parameters/SymbolPath"
        - name: from
          in: query
          required: true
          description: Start of the range, inclusive (epoch seconds, UTC).
          schema:
            type: integer
            minimum: 0
        - name: to
          in: query
          required: true
          description: End of the range, inclusive (epoch seconds, UTC).
          schema:
            type: integer
            minimum: 0
        - name: interval
          in: query
          required: false
          description: Bar timeframe.
          schema:
            $ref: "#/components/schemas/Timeframe"
      responses:
        "200":
          description: Bars in the range. Capped at 5000; if more would fit, `truncated` is true and the most recent 5000 are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalResponse"
        "400":
          $ref: "#/components/responses/BadRange"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSymbol"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/search:
    get:
      tags: [search]
      summary: Substring search over the asset catalog.
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          description: Case-insensitive substring matched against `symbol` and `name`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: Maximum results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Matched assets (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/profile/{symbol}:
    get:
      tags: [profile]
      summary: Asset metadata lookup.
      operationId: getProfile
      parameters:
        - $ref: "#/components/parameters/SymbolPath"
      responses:
        "200":
          description: Asset metadata. Optional fields the gateway cannot fill are omitted, not returned as null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSymbol"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/assets:
    get:
      tags: [catalog]
      summary: List the curated asset catalog with per-asset polling status.
      operationId: listAssets
      description: |
        Paginated, filterable view of the catalog. Each row carries the asset
        metadata plus the aggregated polling status (`active` / `pending` /
        `inactive`) computed from the runtime `feeds` table and the most
        recent bar timestamp.

        Cursor pagination: pass `cursor=<last symbol on previous page>` to
        get the next page. `nextCursor` in the response is omitted on the
        final page.
      parameters:
        - name: exchange
          in: query
          required: false
          description: Filter by exchange (case-sensitive, exact match).
          schema:
            type: string
            maxLength: 64
        - name: asset_class
          in: query
          required: false
          description: Filter by asset class.
          schema:
            $ref: "#/components/schemas/AssetClass"
        - name: q
          in: query
          required: false
          description: Case-insensitive substring matched against `symbol` and `name`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: cursor
          in: query
          required: false
          description: Last `symbol` from the previous page (exclusive lower bound).
          schema:
            type: string
            maxLength: 32
        - name: limit
          in: query
          required: false
          description: Maximum rows to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Paginated catalog, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAssetsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/GrpcUnavailable"
    post:
      tags: [catalog]
      summary: Onboard a new asset and start polling its feeds.
      operationId: createAsset
      description: |
        Registers the asset row and writes one `feeds` row per requested
        timeframe with `status=pending`. The data-svc writer picks the new
        feed up at the top of its next poll cycle (typically within
        `pollEtaSeconds`) and flips the status to `active` after the first
        successful bar insert.

        Returns `201 Created` for a fresh insert and `409 Conflict` when the
        symbol already exists — the 409 body carries the existing row.
      security:
        - bearerAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Asset created; polling starts within `pollEtaSeconds`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAssetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Symbol already exists. The response body carries the existing row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyExistsResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/GrpcUnavailable"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Optional bearer auth. When the `REST_AUTH_TOKEN` env var is set,
        every `/v1/*` call must include `Authorization: Bearer <token>`;
        missing/invalid → 401. `/healthz` is always open.
    bearerAdmin:
      type: http
      scheme: bearer
      description: |
        Admin bearer auth — required for catalog-mutating routes
        (`POST /v1/assets`). When `REST_ADMIN_TOKEN` is set, callers must
        present **this** token; when it is unset, `REST_AUTH_TOKEN` is
        accepted as a fallback. When both are unset the gateway runs in
        open mode (matches the rest of `/v1/*`).

  parameters:
    SymbolPath:
      name: symbol
      in: path
      required: true
      description: TradingView identifier, uppercase, `:`-separated. URL-encode `:` as `%3A`.
      schema:
        type: string
        minLength: 3
        maxLength: 32
        pattern: "^[A-Z0-9]+:[A-Z0-9._/-]+$"
      examples:
        crypto:
          value: BINANCE:BTCUSDT
        equity:
          value: NASDAQ:AAPL

  responses:
    Unauthorized:
      description: Bearer token missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnknownSymbol:
      description: Symbol is not in the asset catalog.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoData:
      description: No bars stored yet for this symbol/timeframe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRange:
      description: Invalid query parameters (e.g. `from >= to`, unsupported interval).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Request validation failed (FastAPI default).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPValidationError"
    GrpcUnavailable:
      description: Upstream gRPC unreachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Timeframe:
      type: string
      enum:
        - "1m"
        - "3m"
        - "5m"
        - "15m"
        - "30m"
        - "1h"
        - "2h"
        - "4h"
        - "1D"
        - "1W"
      default: "1D"

    AssetClass:
      type: string
      enum: [EQUITY, CRYPTO, ETF, FUND]

    Asset:
      type: object
      required: [symbol, name, exchange, currency, assetClass]
      properties:
        symbol:
          type: string
          description: TradingView identifier, uppercase.
          examples: ["BINANCE:BTCUSDT"]
        name:
          type: string
          description: Human-readable asset name.
        exchange:
          type: string
          description: Exchange identifier (typically the prefix before `:` in the symbol).
        type:
          type: string
          description: |
            Spec-compatible short type label (e.g. "stock", "crypto"). Mirrors
            assetClass in lower case for backwards compatibility with the
            original REST API spec's /v1/search example payload.
          examples: ["crypto", "stock", "etf", "fund"]
        currency:
          type: string
          description: ISO 4217 quote currency.
          minLength: 3
          maxLength: 3
        assetClass:
          $ref: "#/components/schemas/AssetClass"
        assetSubClass:
          type: string
          description: Free-form sub-class (e.g. SPOT, PERP, COMMON).
        isin:
          type: string
          description: ISIN if known; omitted otherwise.
          minLength: 12
          maxLength: 12
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          minLength: 2
          maxLength: 2

    Quote:
      type: object
      required: [symbol, timeframe, price, currency, ts, stale]
      properties:
        symbol:
          type: string
          examples: ["BINANCE:BTCUSDT"]
        timeframe:
          $ref: "#/components/schemas/Timeframe"
        price:
          type: number
          format: double
          description: Close price of the latest closed bar.
        currency:
          type: string
          description: Quote currency from the asset catalog.
          minLength: 3
          maxLength: 3
        ts:
          type: integer
          description: Bar open timestamp, epoch seconds UTC.
        stale:
          type: boolean
          description: True if the bar is older than `max_age_seconds`.

    Bar:
      type: object
      required: [ts, open, high, low, close, volume]
      properties:
        ts:
          type: integer
          description: Bar open timestamp, epoch seconds UTC.
        open:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        close:
          type: number
          format: double
        volume:
          type: number
          format: double

    HistoricalResponse:
      type: object
      required: [symbol, interval, bars]
      properties:
        symbol:
          type: string
        interval:
          $ref: "#/components/schemas/Timeframe"
        bars:
          type: array
          items:
            $ref: "#/components/schemas/Bar"
        truncated:
          type: boolean
          description: True if the requested range contained more bars than the cap (5000); the most recent are returned.

    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Asset"

    AssetStatus:
      type: string
      description: |
        Per-asset polling status, aggregated from the runtime `feeds` table:
          * `active`   — at least one feed has produced a bar.
          * `pending`  — feeds registered, no bars yet (writer hasn't run a
            successful cycle for this symbol).
          * `inactive` — feeds explicitly disabled.
      enum: [active, pending, inactive]

    AssetWithStatus:
      type: object
      description: Catalog row + runtime polling state.
      required: [asset, status, addedAt, lastBarTs]
      properties:
        asset:
          $ref: "#/components/schemas/Asset"
        status:
          $ref: "#/components/schemas/AssetStatus"
        addedAt:
          type: integer
          description: Unix seconds — when the asset was first inserted into the catalog. Preserved across upserts.
        lastBarTs:
          type: integer
          description: Most recent bar timestamp (epoch seconds, UTC) across all polling timeframes. `0` when no bars are stored yet.

    ListAssetsResponse:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetWithStatus"
        nextCursor:
          type: string
          description: Cursor for the next page. Omitted on the final page.

    CreateAssetRequest:
      type: object
      description: |
        Body for `POST /v1/assets`. Combines the catalog metadata (`symbol`,
        `name`, `exchange`, …) with the wiring fields the writer needs
        (`storageSymbol`, `tvSymbol`, `timeframes`).
      required: [symbol, storageSymbol, name, exchange, currency, assetClass]
      properties:
        symbol:
          type: string
          description: TradingView identifier, uppercase, `:`-separated.
          pattern: "^[A-Z0-9]+:[A-Z0-9._-]+$"
          minLength: 3
          maxLength: 32
          examples: ["BINANCE:DOGEUSDT"]
        storageSymbol:
          type: string
          description: Internal ccxt key used as `bars.symbol` (e.g. `DOGE/USDT:USDT`).
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        exchange:
          type: string
          minLength: 1
          maxLength: 64
        currency:
          type: string
          description: ISO 4217 quote currency.
          minLength: 3
          maxLength: 3
        assetClass:
          $ref: "#/components/schemas/AssetClass"
        assetSubClass:
          type: string
          description: Free-form sub-class (e.g. SPOT, PERP, COMMON).
          maxLength: 32
        isin:
          type: string
          minLength: 12
          maxLength: 12
        country:
          type: string
          minLength: 2
          maxLength: 2
        timeframes:
          type: array
          description: Timeframes to poll. Defaults to `["1h"]` when empty/omitted.
          items:
            $ref: "#/components/schemas/Timeframe"
          maxItems: 12
        tvSymbol:
          type: string
          description: TradingView chart identifier used by the data-svc CLI. Defaults to `symbol` when omitted.
          maxLength: 64

    CreateAssetResponse:
      type: object
      required: [asset, created, pollEtaSeconds]
      properties:
        asset:
          $ref: "#/components/schemas/AssetWithStatus"
        created:
          type: boolean
          description: True for a fresh insert; false when the symbol already existed (in which case the response is a 409, not a 201).
        pollEtaSeconds:
          type: integer
          description: Approximate seconds until the writer's next poll cycle picks up the new feed.

    AlreadyExistsResponse:
      type: object
      description: 409 body for `POST /v1/assets` when the symbol already exists.
      required: [error, message, existing]
      properties:
        error:
          type: string
          description: Machine-readable error code (`already_exists`).
        message:
          type: string
        existing:
          $ref: "#/components/schemas/AssetWithStatus"

    HealthResponse:
      type: object
      required: [status, grpc_reachable, db_reachable]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        grpc_reachable:
          type: boolean
          description: True if the gateway can reach BarService over the configured GRPC_TARGET.
        db_reachable:
          type: boolean
          description: True if the gateway can SELECT 1 against the configured DATABASE_URL.

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.

    # FastAPI emits these for 422 validation failures; mirrored here so the
    # drift test (FastAPI.openapi() == this file) is a plain dict equality.
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string

security:
  - bearer: []
